[project]
name = "vox-symposium"
version = "0.1.0"
description = "Dataset-driven realtime audio model evaluation runtime."
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.14.1",
    "google-genai>=1.67.0",
    "python-dotenv>=1.0.1",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1",
    "ruff>=0.8",
]
moshi = [
    "numpy>=1.26,<2.3",
    "sphn>=0.2.0,<0.3.0",
]
freeze-omni = [
    "python-socketio[client]>=5.11,<6",
]

[project.scripts]
vox-symposium-evaluate = "vox_symposium.evaluation:main"
vox-symposium-scenario = "vox_symposium.scenario:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_symposium"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
